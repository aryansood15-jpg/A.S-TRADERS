<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 95" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium 3D Metallic Gold Gradient -->
    <linearGradient id="asGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E721D" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF4B8" />
      <stop offset="75%" stop-color="#E2BA45" />
      <stop offset="100%" stop-color="#8A5F11" />
    </linearGradient>

    <!-- Deep Corporate Navy Gradient -->
    <linearGradient id="asNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3354" />
      <stop offset="50%" stop-color="#0F223D" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Subtle Premium Shadow -->
    <filter id="asDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ================= AS MONOGRAM EMBLEM ================= -->
  <g transform="translate(6, 4) scale(0.92)" filter="url(#asDropShadow)">
    <!-- 'A' Left Stem & Base (Navy) -->
    <path d="M 44 8 L 6 86 L 22 86 L 33 60 L 58 60 L 51 44 L 38 44 L 46 26 Z" fill="url(#asNavyGrad)" />
    
    <!-- 'S' Upper Arch & Spine (Navy) -->
    <path d="M 58 20 C 66 8 84 8 94 16 C 102 23 100 35 90 42 C 80 47 74 51 74 58 C 74 64 80 68 88 68 C 94 68 99 64 102 60 L 109 70 C 103 78 94 82 84 82 C 68 82 58 72 58 58 C 58 44 68 37 78 32 C 86 28 88 23 85 19 C 82 15 74 15 68 19 Z" fill="url(#asNavyGrad)" />

    <!-- 'A' Right Stem (Gold Metallic) -->
    <path d="M 44 8 L 58 8 L 84 68 L 70 68 L 57 40 L 46 26 Z" fill="url(#asGoldGrad)" />

    <!-- Upward Growth Arrow & Swoop (Gold Metallic) -->
    <path d="M 28 62 C 42 58 58 48 69 34 C 77 24 85 14 92 4 L 95 13 L 102 0 L 87 1 L 91 6 C 79 17 66 33 39 49 Z" fill="url(#asGoldGrad)" />
    <path d="M 64 62 C 67 73 75 82 86 82 C 96 82 104 74 104 64 C 104 54 94 48 84 41 C 76 35 74 31 74 26 C 74 20 80 18 86 18 C 90 18 94 20 97 23 L 94 28 C 92 26 89 24 86 24 C 82 24 80 26 80 29 C 80 34 86 38 92 43 C 102 50 110 57 110 66 C 110 79 98 88 84 88 C 68 88 57 76 56 62 Z" fill="url(#asGoldGrad)" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Brand Title: A. S. TRADERS -->
  <text x="120" y="50" 
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
        font-size="38" 
        font-weight="900" 
        fill="#0C1E36" 
        letter-spacing="2.5">A. S. TRADERS</text>

  <!-- Subtitle: DEALS WITH ANIMAL FEED SUPPLEMENTS -->
  <text x="122" y="73" 
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
        font-size="11.5" 
        font-weight="800" 
        fill="#047857" 
        letter-spacing="3.2">DEALS WITH ANIMAL FEED SUPPLEMENTS</text>
</svg>
